<div id="app-shell">

    <div class="utility">
      <span>Horario: lunes a jueves 08:30–17:30 · viernes 08:30–14:30</span>
      <span><a href="mailto:info@easyoffice.cl">info@easyoffice.cl</a> &nbsp;·&nbsp; <a href="tel:+56222777781">+56 2 2277 7781</a></span>
    </div>
  
    <header class="nav">
      <a class="logo-wrap" [routerLink]="'/' + auth.currentRole()?.tipo" aria-label="Ir a mi panel">
        <img src="logo.jpg" alt="Easy Office" style="height:34px;">
      </a>
      <div class="nav-right">
        <div class="user-chip">
          <div class="avatar" [style.background]="auth.currentRole()?.avatarBg">{{ auth.currentRole()?.initials }}</div>
          <div>
            <div class="name">{{ auth.currentRole()?.name }}</div>
            <div class="role">{{ auth.currentRole()?.role }}</div>
          </div>
        </div>
        <span class="logout-link" (click)="logout()">Cerrar sesión</span>
      </div>
    </header>
  
    <div class="breadcrumb">
      Inicio &nbsp;›&nbsp; Firmas Electrónicas &nbsp;›&nbsp; <span class="current">{{ auth.currentRole()?.crumb }}</span>
    </div>
  
    <main>
      <router-outlet></router-outlet>
    </main>
  
  </div>
